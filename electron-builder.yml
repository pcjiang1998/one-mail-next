appId: com.pcjiang1998.onemailnext
productName: OneMail Next
protocols:
  - name: OneMail Next mail handler
    schemes:
      - mailto
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - node_modules/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
afterPack: scripts/edit-win-executable.cjs
win:
  executableName: OneMailNext
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  include: build/installer.nsh
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  buildUniversalInstaller: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  icon: build/icon.png
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  icon: build/icons
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - snap
    - deb
  maintainer: pcjiang1998
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: pcjiang1998
  repo: one-mail-next
  releaseType: release
